const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close();}
const K="5cool-pw";const f=document.getElementById("f"),m=document.getElementById("msg"),g=document.getElementById("go");
async function tryPw(pw,save){g.disabled=true;m.textContent="解密中…";try{await open(pw);if(save){try{localStorage.setItem(K,pw)}catch(e){}}}catch(e){g.disabled=false;m.textContent="密碼不正確，請再試一次";try{localStorage.removeItem(K)}catch(_){}}}
f.addEventListener("submit",e=>{e.preventDefault();tryPw(document.getElementById("pw").value,document.getElementById("rem").checked)});
try{const s=localStorage.getItem(K);if(s)tryPw(s,false)}catch(e){}
})();
